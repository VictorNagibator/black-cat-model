<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black cat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --panel: rgba(255, 250, 244, 0.86);
    --ink: #2b211b;
    --muted: #7d6a5c;
    --accent: #e8679f;
    --btn: #f3e7da;
    --btn-on: #2b211b;
    --line: rgba(60, 40, 25, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9dccd; font-family: 'Nunito', system-ui, sans-serif; color: var(--ink); }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; }
  body.laser-on #stage canvas { cursor: none; }

  .panel {
    position: fixed; top: 16px; left: 16px; width: 280px; max-height: calc(100% - 32px); overflow: auto;
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 18px; padding: 16px 16px 12px; box-shadow: 0 10px 40px rgba(60, 40, 20, .15);
    transition: transform .3s ease, opacity .3s;
  }
  body.panel-hidden .panel { transform: translateX(-120%); opacity: 0; }
  h1 { margin: 0 0 2px; font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  #catName { outline: none; border-bottom: 1px dashed transparent; min-width: 40px; }
  #catName:hover, #catName:focus { border-bottom-color: var(--muted); }
  .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 6px; font-weight: 800; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  button {
    font: inherit; font-weight: 700; font-size: 13.5px; border: 0; border-radius: 11px; padding: 8px 8px;
    background: var(--btn); color: var(--ink); cursor: pointer; text-align: left; display: flex; align-items: center; gap: 6px;
    transition: transform .1s, background .2s;
  }
  button:hover { background: #ecdccb; }
  button:active { transform: scale(.97); }
  button.on { background: var(--btn-on); color: #fff; }
  button .e { font-size: 16px; }
  .wide { grid-column: span 2; }
  .opts { display: grid; gap: 7px; font-size: 13.5px; }
  .opts label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  select { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: #fff; padding: 3px 6px; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .hint b { color: var(--ink); }
  #panelToggle {
    position: fixed; top: 16px; right: 16px; width: 40px; height: 40px; justify-content: center; font-size: 18px;
    background: var(--panel); box-shadow: 0 6px 20px rgba(60, 40, 20, .15); border-radius: 50%;
  }

  #emotes { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .emote {
    position: absolute; left: 0; top: 0; font-weight: 800; font-size: 18px; color: var(--ink);
    background: rgba(255,255,255,.9); padding: 3px 10px; border-radius: 14px; white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,.12);
  }
  .emote.big { font-size: 22px; }
  .emote.heart { background: none; box-shadow: none; color: var(--accent); font-size: 24px; }
  .emote.zzz { background: none; box-shadow: none; color: #6b5f8a; font-size: 22px; font-style: italic; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-weight: 800; color: var(--muted); }

  @media (max-width: 640px) {
    .panel { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 46%; border-radius: 18px 18px 0 0; padding: 12px 16px; }
    body.panel-hidden .panel { transform: translateY(110%); }
    .grid { grid-template-columns: 1fr 1fr 1fr; }
    .wide { grid-column: span 3; }
    button { font-size: 12.5px; padding: 7px 6px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="loading" data-i18n="loading">The cat is waking up…</div>
<div id="emotes"></div>

<button id="panelToggle" data-i18n-title="togglePanel" title="Show / hide panel">☰</button>
<aside class="panel">
  <h1>🐈‍⬛ <span id="catName" contenteditable="true" spellcheck="false">Chernushka</span></h1>
  <div class="sub" data-i18n="subtitle"></div>

  <h2 data-i18n="poses"></h2>
  <div class="grid">
    <button data-pose="stand"><span class="e">🐾</span><span data-i18n="pose.stand"></span></button>
    <button data-pose="sit"><span class="e">🪑</span><span data-i18n="pose.sit"></span></button>
    <button data-pose="loaf"><span class="e">🍞</span><span data-i18n="pose.loaf"></span></button>
    <button data-pose="sphinx"><span class="e">🦁</span><span data-i18n="pose.sphinx"></span></button>
    <button data-pose="side"><span class="e">🛋️</span><span data-i18n="pose.side"></span></button>
    <button data-pose="sleep"><span class="e">😴</span><span data-i18n="pose.sleep"></span></button>
    <button data-pose="back" class="wide"><span class="e">🙃</span><span data-i18n="pose.back"></span></button>
  </div>

  <h2 data-i18n="actions"></h2>
  <div class="grid">
    <button data-act="sniff"><span class="e">🧦</span><span data-i18n="act.sniff"></span></button>
    <button data-act="yawn"><span class="e">🥱</span><span data-i18n="act.yawn"></span></button>
    <button data-act="meow"><span class="e">💬</span><span data-i18n="act.meow"></span></button>
    <button data-act="blep"><span class="e">👅</span><span data-i18n="act.blep"></span></button>
    <button data-act="wash"><span class="e">🧼</span><span data-i18n="act.wash"></span></button>
    <button data-act="stretch"><span class="e">🧘</span><span data-i18n="act.stretch"></span></button>
  </div>

  <h2 data-i18n="games"></h2>
  <div class="grid">
    <button id="laser"><span class="e">🔴</span><span data-i18n="laser"></span></button>
    <button id="toy"><span class="e">🐭</span><span data-i18n="toy"></span></button>
  </div>

  <h2 data-i18n="settings"></h2>
  <div class="opts">
    <label><span data-i18n="language"></span>
      <select id="lang">
        <option value="en">English</option>
        <option value="ru">Русский</option>
      </select>
    </label>
    <label><span data-i18n="collar"></span>
      <select id="collar">
        <option value="#e8679f" data-i18n="collar.pink"></option>
        <option value="#5fcf6a" data-i18n="collar.green"></option>
        <option value="none" data-i18n="collar.none"></option>
      </select>
    </label>
    <label><input type="checkbox" id="life" checked> <span data-i18n="life"></span></label>
    <label><input type="checkbox" id="mute" checked> <span data-i18n="sound"></span></label>
    <label><input type="checkbox" id="fur" checked> <span data-i18n="fur"></span></label>
  </div>

  <div class="hint" data-i18n-html="hint"></div>
</aside>

<script type="module" src="./src/main.js"></script>
</body>
</html>
